services:
  neo4j:
    image: neo4j:5.26-enterprise
    container_name: maplestory-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/admin123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_initial_dbms_default__database: mapledb
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs

  neo4j-init:
    image: neo4j:5.26-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    depends_on:
      - neo4j
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      '
      until /var/lib/neo4j/bin/cypher-shell -a bolt://neo4j:7687 -u neo4j -p admin123 "RETURN 1"; do
        sleep 2;
      done;
      /var/lib/neo4j/bin/cypher-shell -a bolt://neo4j:7687 -u neo4j -p admin123
      "CREATE USER admin IF NOT EXISTS SET PASSWORD '\''admin123'\'' CHANGE NOT REQUIRED;
       GRANT ROLE admin TO admin;"
      '
