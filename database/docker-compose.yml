services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maplestory-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-mapledb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mapledb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-enterprise
    container_name: maplestory-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_BOOTSTRAP_USER:-neo4j}/${NEO4J_BOOTSTRAP_PASSWORD:-admin123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_initial_dbms_default__database: ${NEO4J_DATABASE:-mapledb}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u ${NEO4J_BOOTSTRAP_USER:-neo4j} -p ${NEO4J_BOOTSTRAP_PASSWORD:-admin123} 'RETURN 1'"
        ]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  neo4j-init:
    image: neo4j:5.26-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_BOOTSTRAP_USER: ${NEO4J_BOOTSTRAP_USER:-neo4j}
      NEO4J_BOOTSTRAP_PASSWORD: ${NEO4J_BOOTSTRAP_PASSWORD:-admin123}
      NEO4J_ADMIN_USER: ${NEO4J_ADMIN_USER:-admin}
      NEO4J_ADMIN_PASSWORD: ${NEO4J_ADMIN_PASSWORD:-admin123}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-mapledb}
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      '
      until /var/lib/neo4j/bin/cypher-shell -a bolt://neo4j:7687 -u "$$NEO4J_BOOTSTRAP_USER" -p "$$NEO4J_BOOTSTRAP_PASSWORD" "RETURN 1"; do
        sleep 2;
      done;
      /var/lib/neo4j/bin/cypher-shell -a bolt://neo4j:7687 -u "$$NEO4J_BOOTSTRAP_USER" -p "$$NEO4J_BOOTSTRAP_PASSWORD"
      "CREATE DATABASE $$NEO4J_DATABASE IF NOT EXISTS;
       CREATE USER $$NEO4J_ADMIN_USER IF NOT EXISTS SET PASSWORD '\''$$NEO4J_ADMIN_PASSWORD'\'' CHANGE NOT REQUIRED;
       GRANT ROLE admin TO $$NEO4J_ADMIN_USER;"
      '
    restart: "no"

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
